{{- $caption := .Attributes.caption | default "" -}}
{{- $class := .Attributes.class | default "diagram" -}}
<figure class="goat-diagram">
  {{- with diagrams.Goat (trim .Inner "\n\r") -}}
    <svg class="{{ $class }}" width="{{ .Width }}" height="{{ .Height }}" xmlns="http://www.w3.org/2000/svg" version="1.1">{{ .Inner }}</svg>
  {{- end -}}
  {{- with $caption -}}<figcaption>{{ . }}</figcaption>{{- end -}}
</figure>
